openapi: 3.0.3
info:
  title: Haustor.ba REST API
  version: 1.0.0
  description: >-
    RESTful JSON API for Haustor.ba — an apartment building management and direct
    maintenance reporting platform built with FlightPHP and PDO prepared statements
    for IT-2001 Web Programming.

servers:
  - url: http://localhost/haustor.ba/backend
    description: Local XAMPP Apache server
  - url: http://127.0.0.1:8000
    description: Local PHP built-in development server

tags:
  - name: System
    description: API health and metadata endpoints
  - name: Users
    description: Resident and building manager account management
  - name: Buildings
    description: Residential building records and geocoded locations
  - name: Apartments
    description: Individual apartment units within buildings
  - name: Categories
    description: Standardized maintenance issue categories
  - name: Maintenance Requests
    description: Maintenance ticket reporting and lifecycle tracking

paths:
  /:
    get:
      tags: [System]
      summary: API status and endpoint index
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: Haustor.ba REST API
                  status:
                    type: string
                    example: ok
                  endpoints:
                    type: array
                    items:
                      type: string

  /users:
    get:
      tags: [Users]
      summary: List all users
      parameters:
        - name: role
          in: query
          required: false
          description: Optional filter by user role
          schema:
            type: string
            enum: [resident, manager]
      responses:
        '200':
          description: Array of user records (excluding password hashes)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Users]
      summary: Retrieve a user by ID
      responses:
        '200':
          description: User record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Users]
      summary: Update an existing user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated user record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Users]
      summary: Delete a user by ID
      responses:
        '200':
          $ref: '#/components/responses/DeleteSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /buildings:
    get:
      tags: [Buildings]
      summary: List all buildings
      parameters:
        - name: manager_id
          in: query
          required: false
          description: Optional filter by assigned manager user ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Array of building records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Buildings]
      summary: Create a new building
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingCreate'
      responses:
        '201':
          description: Building created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /buildings/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Buildings]
      summary: Retrieve a building by ID
      responses:
        '200':
          description: Building record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Buildings]
      summary: Update an existing building
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuildingUpdate'
      responses:
        '200':
          description: Updated building record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Buildings]
      summary: Delete a building by ID
      responses:
        '200':
          $ref: '#/components/responses/DeleteSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /apartments:
    get:
      tags: [Apartments]
      summary: List all apartments
      parameters:
        - name: building_id
          in: query
          required: false
          description: Optional filter by building ID
          schema:
            type: integer
            minimum: 1
        - name: resident_id
          in: query
          required: false
          description: Optional filter by assigned resident user ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Array of apartment records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Apartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Apartments]
      summary: Create a new apartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApartmentCreate'
      responses:
        '201':
          description: Apartment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /apartments/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Apartments]
      summary: Retrieve an apartment by ID
      responses:
        '200':
          description: Apartment record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Apartments]
      summary: Update an existing apartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApartmentUpdate'
      responses:
        '200':
          description: Updated apartment record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Apartments]
      summary: Delete an apartment by ID
      responses:
        '200':
          $ref: '#/components/responses/DeleteSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories:
    get:
      tags: [Categories]
      summary: List all maintenance categories
      responses:
        '200':
          description: Array of category records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Categories]
      summary: Create a new maintenance category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Categories]
      summary: Retrieve a category by ID
      responses:
        '200':
          description: Category record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Categories]
      summary: Update an existing category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Updated category record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Categories]
      summary: Delete a category by ID
      responses:
        '200':
          $ref: '#/components/responses/DeleteSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /maintenance-requests:
    get:
      tags: [Maintenance Requests]
      summary: List all maintenance requests
      parameters:
        - name: building_id
          in: query
          required: false
          description: Optional filter by building ID
          schema:
            type: integer
            minimum: 1
        - name: reported_by_user_id
          in: query
          required: false
          description: Optional filter by reporter user ID
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: false
          description: Optional filter by workflow status
          schema:
            type: string
            enum: [pending, in_progress, resolved, rejected]
      responses:
        '200':
          description: Array of maintenance request records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Maintenance Requests]
      summary: Submit a new maintenance request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestCreate'
      responses:
        '201':
          description: Maintenance request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /maintenance-requests/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Maintenance Requests]
      summary: Retrieve a maintenance request by ID
      responses:
        '200':
          description: Maintenance request record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Maintenance Requests]
      summary: Update an existing maintenance request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestUpdate'
      responses:
        '200':
          description: Updated maintenance request record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Maintenance Requests]
      summary: Delete a maintenance request by ID
      responses:
        '200':
          $ref: '#/components/responses/DeleteSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Positive integer resource ID
      schema:
        type: integer
        minimum: 1

  responses:
    DeleteSuccess:
      description: Resource deleted successfully
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteResponse'
    BadRequest:
      description: Validation error or malformed JSON request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Field "email" must be a valid email address.
            status: 400
    NotFound:
      description: Requested resource or endpoint was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: User not found.
            status: 404
    InternalServerError:
      description: Unexpected server or database error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: Internal server error.
            status: 500

  schemas:
    DeleteResponse:
      type: object
      properties:
        message:
          type: string
          example: Resource deleted successfully.

    ErrorResponse:
      type: object
      required: [error, status]
      properties:
        error:
          type: string
        status:
          type: integer

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        full_name:
          type: string
          maxLength: 100
          example: Tarik Sorguč
        email:
          type: string
          format: email
          maxLength: 150
          example: tarik.sorguc@haustor.ba
        phone:
          type: string
          nullable: true
          maxLength: 30
          example: '+387 61 111 222'
        role:
          type: string
          enum: [resident, manager]
          example: manager
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserCreate:
      type: object
      required: [full_name, email, password]
      properties:
        full_name:
          type: string
          maxLength: 100
          example: Damir Sorguč
        email:
          type: string
          format: email
          maxLength: 150
          example: damir.sorguc@gmail.com
        password:
          type: string
          format: password
          minLength: 6
          example: Haustor123!
        phone:
          type: string
          nullable: true
          maxLength: 30
          example: '+387 62 333 444'
        role:
          type: string
          enum: [resident, manager]
          default: resident

    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          format: password
          minLength: 6
        phone:
          type: string
          nullable: true
          maxLength: 30
        role:
          type: string
          enum: [resident, manager]

    Building:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          maxLength: 150
          example: Haustor Grbavička 14
        address:
          type: string
          maxLength: 255
          example: Grbavička 14
        city:
          type: string
          maxLength: 100
          example: Sarajevo
        postal_code:
          type: string
          maxLength: 20
          example: '71000'
        latitude:
          type: number
          format: double
          nullable: true
          example: 43.8516
        longitude:
          type: number
          format: double
          nullable: true
          example: 18.3964
        total_floors:
          type: integer
          minimum: 1
          example: 6
        manager_id:
          type: integer
          nullable: true
          example: 1
        manager_name:
          type: string
          nullable: true
          example: Tarik Sorguč
        manager_email:
          type: string
          nullable: true
          example: tarik.sorguc@haustor.ba
        created_at:
          type: string
          format: date-time

    BuildingCreate:
      type: object
      required: [name, address, city, postal_code]
      properties:
        name:
          type: string
          maxLength: 150
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        total_floors:
          type: integer
          minimum: 1
          default: 1
        manager_id:
          type: integer
          nullable: true
          minimum: 1

    BuildingUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 150
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        latitude:
          type: number
          format: double
          nullable: true
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          minimum: -180
          maximum: 180
        total_floors:
          type: integer
          minimum: 1
        manager_id:
          type: integer
          nullable: true
          minimum: 1

    Apartment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        building_id:
          type: integer
          example: 1
        resident_id:
          type: integer
          nullable: true
          example: 3
        apartment_number:
          type: string
          maxLength: 20
          example: 4B
        floor:
          type: integer
          example: 2
        area_sqm:
          type: number
          format: double
          nullable: true
          example: 64.5
        building_name:
          type: string
          example: Haustor Grbavička 14
        building_address:
          type: string
          example: Grbavička 14
        resident_name:
          type: string
          nullable: true
          example: Damir Sorguč
        resident_email:
          type: string
          nullable: true
          example: damir.sorguc@gmail.com
        created_at:
          type: string
          format: date-time

    ApartmentCreate:
      type: object
      required: [building_id, apartment_number]
      properties:
        building_id:
          type: integer
          minimum: 1
        resident_id:
          type: integer
          nullable: true
          minimum: 1
        apartment_number:
          type: string
          maxLength: 20
          example: 4B
        floor:
          type: integer
          default: 0
        area_sqm:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: 0

    ApartmentUpdate:
      type: object
      properties:
        building_id:
          type: integer
          minimum: 1
        resident_id:
          type: integer
          nullable: true
          minimum: 1
        apartment_number:
          type: string
          maxLength: 20
        floor:
          type: integer
        area_sqm:
          type: number
          format: double
          nullable: true
          exclusiveMinimum: 0

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          maxLength: 100
          example: Vodoinstalacije
        description:
          type: string
          nullable: true
          example: Kvarovi na vodovodnim cijevima, ventilima i odvodima.
        default_priority:
          type: string
          enum: [low, medium, high, urgent]
          example: urgent
        created_at:
          type: string
          format: date-time

    CategoryCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        default_priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          nullable: true
        default_priority:
          type: string
          enum: [low, medium, high, urgent]

    MaintenanceRequest:
      type: object
      properties:
        id:
          type: integer
          example: 1
        building_id:
          type: integer
          example: 1
        apartment_id:
          type: integer
          nullable: true
          example: 1
        reported_by_user_id:
          type: integer
          example: 3
        category_id:
          type: integer
          example: 5
        title:
          type: string
          maxLength: 150
          example: Curenje radijatora u dnevnom boravku
        description:
          type: string
          example: Na spoju ventila glavnog radijatora primijećeno je kapanje vode.
        priority:
          type: string
          enum: [low, medium, high, urgent]
          example: urgent
        status:
          type: string
          enum: [pending, in_progress, resolved, rejected]
          example: pending
        resolution_notes:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        building_name:
          type: string
          example: Haustor Grbavička 14
        building_address:
          type: string
          example: Grbavička 14
        apartment_number:
          type: string
          nullable: true
          example: 4B
        reported_by_name:
          type: string
          example: Damir Sorguč
        reported_by_email:
          type: string
          example: damir.sorguc@gmail.com
        category_name:
          type: string
          example: Grijanje
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MaintenanceRequestCreate:
      type: object
      required: [building_id, reported_by_user_id, category_id, title, description]
      properties:
        building_id:
          type: integer
          minimum: 1
        apartment_id:
          type: integer
          nullable: true
          minimum: 1
        reported_by_user_id:
          type: integer
          minimum: 1
        category_id:
          type: integer
          minimum: 1
        title:
          type: string
          maxLength: 150
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, urgent]
          default: medium
        status:
          type: string
          enum: [pending, in_progress, resolved, rejected]
          default: pending
        resolution_notes:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true

    MaintenanceRequestUpdate:
      type: object
      properties:
        building_id:
          type: integer
          minimum: 1
        apartment_id:
          type: integer

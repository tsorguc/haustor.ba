<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haustor.ba - Sistem za upravljanje zgradama i prijavu kvarova</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Mobilno zaglavlje (vidljivo samo na ekranima < 992px) -->
    <header
      class="d-lg-none bg-white border-bottom p-3 d-flex justify-content-between align-items-center sticky-top"
    >
      <a
        href="#/login"
        class="text-decoration-none fw-bold d-flex align-items-center text-dark"
      >
        <div
          class="brand-icon-box bg-primary text-white rounded-3 me-2 d-flex align-items-center justify-content-center"
          style="width: 36px; height: 36px;"
        >
          <i class="fa-solid fa-building-user"></i>
        </div>
        <span class="fs-5">Haustor<span class="text-primary">.ba</span></span>
      </a>
      <button
        class="btn btn-outline-secondary btn-sm border-0"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#sidebarOffcanvas"
        aria-controls="sidebarOffcanvas"
        aria-label="Otvori navigaciju"
      >
        <i class="fa-solid fa-bars fa-lg"></i>
      </button>
    </header>

    <!-- Glavni fleksibilni kontejner (Sidebar + Dinamički sadržaj) -->
    <div class="d-flex min-vh-100">
      <!-- Lijeva bočna traka (Desktop fiksna / Mobilni offcanvas) -->
      <aside
        class="offcanvas-lg offcanvas-start bg-white border-end d-flex flex-column p-3 sidebar-container"
        tabindex="-1"
        id="sidebarOffcanvas"
        aria-labelledby="sidebarOffcanvasLabel"
      >
        <!-- Zaglavlje bočne trake sa logotipom -->
        <div
          class="d-flex justify-content-between align-items-center pb-3 mb-3 border-bottom"
        >
          <a
            href="#/login"
            class="navbar-brand fw-bold d-flex align-items-center text-decoration-none"
            id="sidebarOffcanvasLabel"
          >
            <div
              class="brand-icon-box bg-primary text-white rounded-3 me-2 d-flex align-items-center justify-content-center"
              style="width: 36px; height: 36px;"
            >
              <i class="fa-solid fa-building-user"></i>
            </div>
            <span class="fs-5"
              >Haustor<span class="text-primary">.ba</span></span
            >
          </a>
          <button
            type="button"
            class="btn-close d-lg-none"
            data-bs-dismiss="offcanvas"
            data-bs-target="#sidebarOffcanvas"
            aria-label="Zatvori"
          ></button>
        </div>

        <!-- Navigacijski meni -->
        <ul class="nav nav-pills flex-column gap-1 mb-auto">
          <li class="nav-item">
            <a class="nav-link" href="#/resident" id="nav-resident">
              <i class="fa-solid fa-user me-2"></i>Korisnički panel
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/manager" id="nav-manager">
              <i class="fa-solid fa-screwdriver-wrench me-2"></i>Upraviteljski
              panel
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/map" id="nav-map">
              <i class="fa-solid fa-map-location-dot me-2"></i>Karta zgrada
            </a>
          </li>

          <li class="my-2 border-top"></li>
          <li
            class="px-3 py-1 text-uppercase text-muted small fw-semibold"
            style="font-size: 0.72rem; letter-spacing: 0.05em;"
          >
            Račun
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#/login" id="nav-login">
              <i class="fa-solid fa-right-to-bracket me-2"></i>Prijava
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#/register" id="nav-register">
              <i class="fa-solid fa-user-plus me-2"></i>Registracija
            </a>
          </li>
        </ul>

        <!-- Podnožje bočne trake -->
        <div class="mt-auto pt-3 border-top text-muted small text-center">
          &copy; 2026 Haustor.ba &middot; IT-2001
        </div>
      </aside>

      <!-- SPA Dinamički kontejner -->
      <main id="app-view" class="flex-grow-1 p-3 p-md-4 overflow-auto">
        <!-- Dinamički šabloni iz frontend/views/ se učitavaju ovdje -->
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
